; ChaseGuard 2.0 settings. Every key is optional; delete this file to use the defaults.
[ChaseGuard]

; Replace the 434 references that cause "R6025 - pure virtual function call" in long pursuits.
EnablePatch=1

; Install the crash-recovery exception handler.
EnableHandler=1

; Skip a game instruction that reads/writes through a broken pointer.
RecoverFaults=1

; Recover when game code calls through a broken pointer (returns 0 to the caller).
RecoverBadCalls=1

; When a skipped instruction was a load ("mov reg, [bad]"), set that register to 0,
; so the game's own "is it NULL?" checks take over instead of using a stale value.
ZeroLoadedRegister=1

; If one place in game code needs recovery more often than this per second, it is an endless
; loop: ChaseGuard stops recovering there and lets the game crash normally instead of freezing.
LoopLimit=500

; chaseguard.log (in the game folder) starts over when it is bigger than this at game start.
MaxLogKB=1024

; 1 = 10 seconds after start, provoke three harmless test faults in game code and write
; PASS/FAIL to chaseguard.log. For testing only.
SelfTest=0
