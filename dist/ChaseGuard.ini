; ChaseGuard 2.2 settings. Every key is optional; delete this file to use the defaults.
[ChaseGuard]

; Replace the 434 references that cause "R6025 - pure virtual function call" in long pursuits.
EnablePatch=1

; What a call on an already destroyed game interface (the cause of R6025) does:
; 2 = ChaseGuard's table: the call is logged and returns 0 (0.0 for float results) without
;     touching the destroyed object, its arguments are removed. Recommended.
; 1 = ChaseGuard's table, but the call runs the MWCrashFix method (logged).
; 0 = exactly MWCrashFix: table 0x8AA828, the call runs a method of another class on the
;     destroyed object (some of them write into it). Nothing is logged.
PatchMode=2

; Fix the game's interface unregister function (0x5D5A50). It removes an entry with
; v.erase(std::remove(...)): an interface listed twice leaves a dangling pointer behind, one not
; listed at all makes it overwrite the heap. Every such case is logged.
FixInterfaceRegistry=1

; Install the crash-recovery exception handler.
EnableHandler=1

; Skip a game instruction that reads/writes through a broken pointer.
RecoverFaults=1

; Recover when game code calls through a broken pointer (returns 0 to the caller).
RecoverBadCalls=1

; "R6025 - pure virtual function call": instead of closing the game, return 0 to the code that
; made the call (like RecoverBadCalls). 0 = let the game show R6025 and exit, as without ChaseGuard.
; Every such call is logged with its address either way.
RecoverPureCalls=1

; After a recovered call (bad pointer or R6025) also remove the arguments the called function
; would have removed from the stack, so the game continues with a correct stack. ChaseGuard works
; out their size from the calling code (exact for about 89 % of the game's calls).
CorrectStack=1

; When a skipped instruction was a load ("mov reg, [bad]"), set that register to 0,
; so the game's own "is it NULL?" checks take over instead of using a stale value.
ZeroLoadedRegister=1

; If one place in game code needs recovery more often than this per second, it is an endless
; loop: ChaseGuard stops recovering there and lets the game crash normally instead of freezing.
LoopLimit=500

; chaseguard.log (in the game folder) starts over when it is bigger than this at game start.
MaxLogKB=1024

; 1 = 10 seconds after start, provoke five harmless test faults in game code and write
; PASS/FAIL to chaseguard.log. For testing only.
SelfTest=0
